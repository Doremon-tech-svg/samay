services:
  db:
    image: postgres:16
    restart: always
    environment:
      POSTGRES_USER: samay
      POSTGRES_PASSWORD: samay
      POSTGRES_DB: samay
    ports:
      - "5432:5432"
    volumes:
      - samay_pg_prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U samay -d samay"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://samay:samay@db:5432/samay
      PORT: 4000
      DEMO_MODE: 1
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
    ports:
      - "4000:4000"

volumes:
  samay_pg_prod: {}
